<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>流量管家</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a84ff">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="流量管家">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- ========== 首頁 ========== -->
    <section id="page-home" class="page active">
      <header class="top">
        <p class="date" id="today-text"></p>
        <h1>流量管家</h1>
      </header>

      <div id="warning-list"></div>

      <!-- 本月剩餘 -->
      <div class="card">
        <p class="label">本月剩餘流量</p>
        <p class="hero-num"><span id="remaining-mb">0</span><span class="unit">MB</span></p>
        <div class="bar"><div class="bar-fill" id="month-bar"></div></div>
        <div class="row-between small">
          <span id="month-used-text"></span>
          <span id="month-total-text"></span>
        </div>
        <p class="small muted" id="cycle-text"></p>
      </div>

      <!-- 今日額度 -->
      <div class="card">
        <p class="label">今日動態額度</p>
        <p class="hero-num"><span id="quota-mb">0</span><span class="unit">MB</span></p>
        <div class="bar"><div class="bar-fill" id="today-bar"></div></div>
        <div class="stats">
          <div>
            <p class="stat-num" id="used-today">0</p>
            <p class="stat-label">今日已用 MB</p>
          </div>
          <div>
            <p class="stat-num" id="left-today">0</p>
            <p class="stat-label">今日剩餘 MB</p>
          </div>
        </div>
      </div>

      <!-- 重置倒數 -->
      <div class="card row-between">
        <div>
          <p class="label">距離下次重置</p>
          <p class="muted small" id="reset-date-text"></p>
        </div>
        <p class="days"><span id="days-left">0</span><span class="unit">天</span></p>
      </div>

      <!-- 各 App -->
      <div class="card">
        <p class="label">各 App 今日流量</p>
        <ul class="app-list" id="app-list"></ul>
        <p class="note">
          資料來源：手動輸入。iOS 不允許網頁讀取其他 App 的行動數據用量，
          請到 iPhone「設定 → 行動服務」查看後自行輸入。
        </p>
      </div>
    </section>

    <!-- ========== 紀錄（預留） ========== -->
    <section id="page-history" class="page">
      <header class="top"><h1>紀錄</h1></header>
      <div class="card"><p class="muted">每日流量紀錄將在第五階段完成。</p></div>
    </section>

       <!-- ========== 設定 ========== -->
    <section id="page-settings" class="page">
      <header class="top"><h1>設定</h1></header>

      <div class="card">
        <p class="label">流量方案</p>
        <label class="field">每月流量（MB，1 GB = 1000 MB）
          <input id="in-monthly" type="number" inputmode="decimal" min="1">
        </label>
        <label class="field">每月重置日（1～31）
          <input id="in-reset" type="number" inputmode="numeric" min="1" max="31">
        </label>
      </div>

      <div class="card">
        <p class="label">目前用量（手動輸入）</p>
        <label class="field">目前剩餘流量（MB）
          <input id="in-remaining" type="number" inputmode="decimal" min="0">
        </label>
        <label class="field">今日已用流量（MB，已包含在上面的剩餘中）
          <input id="in-used" type="number" inputmode="decimal" min="0">
        </label>
        <p class="note">資料來源：手動輸入。請參考電信業者 App，或 iPhone「設定 → 行動服務」。</p>
      </div>

      <div class="card">
        <p class="label">計算預覽</p>
        <p class="small" id="set-preview"></p>
      </div>

      <button id="save-btn" class="btn">儲存</button>
      <p id="save-msg" class="small center"></p>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab active" data-page="page-home"><span class="ico">📊</span>首頁</button>
    <button class="tab" data-page="page-history"><span class="ico">🗓️</span>紀錄</button>
    <button class="tab" data-page="page-settings"><span class="ico">⚙️</span>設定</button>
  </nav>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
